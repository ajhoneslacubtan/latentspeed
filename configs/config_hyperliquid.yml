# Hyperliquid MarketStream config (perpetuals)
# Compatible with latentspeed/src/marketstream.cpp (feeds/zmq/log schema)

zmq:
  enabled: true
  host: 127.0.0.1
  port: 5556        # trades on 5556, books on 5557
  window_size: 20
  depth_levels: 10
  deltas:
    enabled: true              # emit preprocessed_book_delta and preprocessed_book_ckpt (no snapshots)
    checkpoint_every_ms: 1000  # checkpoint cadence (ms)

log:
  level: info       # trace|debug|info|warn|error|critical
  # filename: logs/hyperliquid_marketstream.log

feeds:
  - exchange: hyperliquid
    symbols:
      # Top 30 by 24h volume (updated 2025-11-24 from Hyperliquid API)
      - BTC-USDC-PERP
      - ETH-USDC-PERP
      - HYPE-USDC-PERP
      - SOL-USDC-PERP
      - ZEC-USDC-PERP
      - XRP-USDC-PERP
      - FARTCOIN-USDC-PERP
      - ASTER-USDC-PERP
      - XPL-USDC-PERP
      - TNSR-USDC-PERP
      - PUMP-USDC-PERP
      - SUI-USDC-PERP
      - STRK-USDC-PERP
      - BCH-USDC-PERP
      - TAO-USDC-PERP
      - DOGE-USDC-PERP
      - MON-USDC-PERP
      - BNB-USDC-PERP
      - ADA-USDC-PERP
      - UNI-USDC-PERP
      - ENA-USDC-PERP
      - WLFI-USDC-PERP
      - LINK-USDC-PERP
      - AVAX-USDC-PERP
      - AAVE-USDC-PERP
      - NEO-USDC-PERP
      # - kPEPE-USDC-PERP
      # - MET-USDC-PERP
      # - TRUMP-USDC-PERP
      # - NEAR-USDC-PERP
      - AVNT-USDC-PERP
    enable_trades: true
    enable_orderbook: true
    # snapshots_only is ignored when zmq.deltas.enabled=true (delta/ckpt mode)
    snapshots_only: false
    snapshot_interval: 1   # seconds (legacy)
    reconnect_attempts: 10
    reconnect_delay_ms: 5000
    subscription_delay_ms: 1000  # Delay between subscriptions (ms) - CRITICAL for 30+ symbols to avoid rate limits
